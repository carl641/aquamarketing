<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="skyMobile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F4FF"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="300" height="200" fill="url(#skyMobile)"/>
  <!-- City skyline -->
  <rect x="20" y="80" width="40" height="120" fill="#4A5568"/>
  <rect x="25" y="85" width="8" height="12" fill="#FFD700" opacity="0.8"/>
  <rect x="37" y="85" width="8" height="12" fill="#FFD700" opacity="0.6"/>
  <rect x="25" y="102" width="8" height="12" fill="#FFD700" opacity="0.7"/>
  <rect x="37" y="102" width="8" height="12" fill="#FFD700" opacity="0.5"/>

  <rect x="70" y="60" width="50" height="140" fill="#2D3748"/>
  <rect x="75" y="65" width="10" height="15" fill="#87CEEB" opacity="0.8"/>
  <rect x="90" y="65" width="10" height="15" fill="#87CEEB" opacity="0.7"/>
  <rect x="105" y="65" width="10" height="15" fill="#87CEEB" opacity="0.6"/>

  <rect x="130" y="100" width="35" height="100" fill="#4A5568"/>
  <rect x="175" y="70" width="45" height="130" fill="#2D3748"/>
  <rect x="230" y="90" width="50" height="110" fill="#4A5568"/>

