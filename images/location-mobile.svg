  <line x1="285" y1="122" x2="285" y2="160" stroke="#718096" stroke-width="2"/>

  <!-- Water/bay -->
  <rect x="0" y="170" width="300" height="30" fill="#0083B0" opacity="0.6"/>
  <path d="M0 175 Q30 170 60 175 Q90 180 120 175 Q150 170 180 175 Q210 180 240 175 Q270 170 300 175" stroke="white" stroke-width="1" fill="none" opacity="0.4"/>
</svg>