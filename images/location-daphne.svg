<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="skyDaphne" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F4FF"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="300" height="200" fill="url(#skyDaphne)"/>
  <!-- Rolling hills -->
  <ellipse cx="80" cy="200" rx="120" ry="60" fill="#228B22"/>
  <ellipse cx="220" cy="200" rx="100" ry="50" fill="#2E8B2E"/>
  <!-- Trees -->
  <g fill="#1B5E20">
    <!-- Tree 1 -->
    <rect x="45" y="120" width="8" height="30" fill="#5D4037"/>
    <ellipse cx="49" cy="105" rx="20" ry="25"/>
    <!-- Tree 2 -->
    <rect x="95" y="130" width="6" height="25" fill="#5D4037"/>
    <ellipse cx="98" cy="118" rx="15" ry="20"/>
    <!-- Tree 3 -->
    <rect x="155" y="125" width="7" height="28" fill="#5D4037"/>
    <ellipse cx="158" cy="110" rx="18" ry="22"/>
    <!-- Tree 4 -->
    <rect x="210" y="135" width="6" height="22" fill="#5D4037"/>
    <ellipse cx="213" cy="123" rx="14" ry="18"/>
    <!-- Tree 5 -->
    <rect x="255" y="128" width="7" height="26" fill="#5D4037"/>
    <ellipse cx="258" cy="115" rx="16" ry="20"/>
  </g>
  <!-- Suburban houses -->
  <g>
    <!-- House 1 -->
    <rect x="70" y="150" width="30" height="25" fill="#F5F5DC"/>
    <polygon points="70,150 85,135 100,150" fill="#8B4513"/>
    <rect x="80" y="160" width="10" height="15" fill="#5D4037"/>
    <!-- House 2 -->
    <rect x="130" y="155" width="25" height="22" fill="#FFF8DC"/>
    <polygon points="130,155 142,142 155,155" fill="#A0522D"/>
    <rect x="138" y="163" width="8" height="14" fill="#5D4037"/>
    <!-- House 3 -->
    <rect x="190" y="152" width="28" height="24" fill="#F0E68C"/>
    <polygon points="190,152 204,138 218,152" fill="#8B4513"/>
    <rect x="198" y="162" width="9" height="14" fill="#5D4037"/>
  </g>
  <!-- Eastern Shore text area - Mobile Bay glimpse -->
  <rect x="0" y="180" width="300" height="20" fill="#0083B0" opacity="0.4"/>
</svg>